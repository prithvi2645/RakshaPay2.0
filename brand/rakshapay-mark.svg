<!--
  RakshaPay — the single brand mark.

  This file is the source of truth. Everything else is generated from or drawn
  to match it:

    web/src/components/BrandMark.tsx   same path data, inline so it inherits colour
    app/lib/widgets/brand_mark.dart    the same two paths as a Flutter CustomPainter
    app/android/.../mipmap-*/          launcher icons, generated by tools/build-icons.mjs

  Geometry is on a 48x48 grid with deliberately round numbers, so the three
  implementations can be compared by eye and a drifted copy is obvious.

  "Raksha" means protection. A shield with a check inside reads correctly at
  24px on a phone status bar and at 200px on a slide, which a more elaborate
  mark would not.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="RakshaPay">
  <title>RakshaPay</title>
  <path
    d="M24 4 L42 11 V24 C42 34.5 34.8 43.6 24 46.6 C13.2 43.6 6 34.5 6 24 V11 Z"
    fill="none"
    stroke="currentColor"
    stroke-width="3.5"
    stroke-linejoin="round"
  />
  <path
    d="M15.5 24.5 L21.5 30.5 L33 18.5"
    fill="none"
    stroke="currentColor"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
